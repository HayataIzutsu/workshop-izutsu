<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ポモドーロタイマー</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <h1>ポモドーロタイマー</h1>
      <button id="settings-button" class="icon-button" type="button" aria-label="設定">設定</button>
    </header>

    <section class="timer-panel" aria-labelledby="mode-label">
      <p id="mode-label" class="mode-label">作業中</p>
      <label class="task-field">タスク名<input id="task-name" type="text" maxlength="120" placeholder="今集中するタスク"></label>
      <label class="task-field">メモ<textarea id="task-note" rows="2" maxlength="500" placeholder="セッションのメモ（任意）"></textarea></label>
      <div class="timer-ring" id="timer-ring" role="timer" aria-live="polite" aria-label="残り時間">
        <span id="remaining-time">25:00</span>
      </div>
      <div class="timer-actions">
        <button id="start-button" class="primary-button" type="button">開始</button>
        <button id="reset-button" class="secondary-button" type="button">リセット</button>
      </div>
    </section>

    <section class="history-panel" aria-labelledby="history-heading">
      <div class="section-heading"><h2 id="history-heading">最近のセッション</h2><a href="/api/export">CSV出力</a></div>
      <ul id="session-history"><li>履歴を読み込んでいます。</li></ul>
    </section>

    <section class="progress-panel" aria-labelledby="progress-heading">
      <h2 id="progress-heading">今日の進捗</h2>
      <div class="progress-grid">
        <div>
          <strong id="completed-sessions">0</strong>
          <span>完了</span>
        </div>
        <div>
          <strong id="focus-time">0分</strong>
          <span>集中時間</span>
        </div>
      </div>
      <p id="status-message" class="status-message" role="status"></p>
    </section>

    <dialog id="settings-dialog">
      <form method="dialog" id="settings-form">
        <h2>設定</h2>
        <label>作業時間（分）<input id="work-minutes" type="number" min="1" max="180" value="25"></label>
        <label>短い休憩（分）<input id="short-break-minutes" type="number" min="1" max="60" value="5"></label>
        <label>長い休憩（分）<input id="long-break-minutes" type="number" min="1" max="120" value="15"></label>
        <label>長い休憩までの回数<input id="long-break-interval" type="number" min="1" max="20" value="4"></label>
        <label class="checkbox-label"><input id="auto-start" type="checkbox"> 次のセッションを自動開始</label>
        <div class="dialog-actions">
          <button value="cancel" type="submit">キャンセル</button>
          <button id="save-settings" value="default" type="submit">保存</button>
        </div>
      </form>
    </dialog>
  </main>
  <script src="/js/format.js" defer></script>
  <script src="/js/pomodoroEngine.js" defer></script>
  <script src="/js/view.js" defer></script>
  <script src="/js/api.js" defer></script>
  <script src="/js/app.js" defer></script>
</body>
</html>
