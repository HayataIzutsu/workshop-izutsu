<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pomodoro Timer</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body class="theme-light">
    <main class="app" id="app">
      <h1>Pomodoro Timer</h1>
      <section class="settings">
        <label>
          作業時間
          <select id="workDuration">
            <option value="15">15分</option>
            <option value="25" selected>25分</option>
            <option value="35">35分</option>
            <option value="45">45分</option>
          </select>
        </label>
        <label>
          休憩時間
          <select id="breakDuration">
            <option value="5" selected>5分</option>
            <option value="10">10分</option>
            <option value="15">15分</option>
          </select>
        </label>
        <label>
          テーマ
          <select id="theme">
            <option value="light" selected>ライト</option>
            <option value="dark">ダーク</option>
            <option value="focus">フォーカス</option>
          </select>
        </label>
      </section>
      <section class="sound">
        <label><input id="startSound" type="checkbox" checked /> 開始音</label>
        <label><input id="endSound" type="checkbox" checked /> 終了音</label>
        <label><input id="tickSound" type="checkbox" /> Tick音</label>
      </section>
      <section class="timer">
        <p id="phaseLabel">作業</p>
        <p id="timeDisplay">25:00</p>
        <div class="actions">
          <button id="startButton" type="button">開始</button>
          <button id="resetButton" type="button">リセット</button>
        </div>
      </section>
      <section class="stats">
        <h2>設定利用統計</h2>
        <pre id="stats"></pre>
      </section>
    </main>
    <script src="/js/pomodoro.js"></script>
  </body>
</html>
